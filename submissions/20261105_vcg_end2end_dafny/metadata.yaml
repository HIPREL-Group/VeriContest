  contact: aditya@emergence.ai
  description: 'VCG (Verifiable Code Generation): a multi-stage agent that writes a Dafny specification,
    implementation and proof, repairs them with verifier feedback, and checks the assembled program before
    it is accepted.'
  report_url: null
  source_url: null
