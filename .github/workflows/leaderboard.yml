name: Validate leaderboard submissions

on:
  pull_request:
    paths:
      - 'submissions/**'
      - 'leaderboard/**'
      - 'templates/submission/**'
      - 'docs/**'
      - 'benchmark/**'
      - '.github/**'
  push:
    branches: [main]
    paths:
      - 'submissions/**'
      - 'leaderboard/**'
      - 'templates/submission/**'
      - 'docs/**'
      - '.github/workflows/leaderboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r leaderboard/requirements.txt
      - name: Validate registry and review records
        run: python leaderboard/manage.py validate
      - name: Test ranking and review gates
        run: python -m unittest discover -s leaderboard -p 'test_*.py'
      - name: Test browser ranking logic
        run: node --test leaderboard/test_frontend.cjs
      - name: Build static registry data
        run: python leaderboard/manage.py build
